version: '1:2.2.0-2'
changelog: |-
  Fork of jellyfin-kodi 2.2.0 (twiebe)
  ------------------------------------
  + Update sync only writes the items that changed, fetched in parallel
  + Don't wipe the library when fetching its items fails
  + Don't sync a library twice after an interrupted sync
  + Page size setting is no longer silently limited to 50
  + Faster sync: shared exit monitor, artwork settings read once, cached row class
  + Don't keep Kodi from exiting with the websocket, service restart works again
  + Roll back database changes when an error is raised
  + Keep the saved login when the server answers with an error
  + Close the progress dialog when a sync fails
  + Notify about new items after the first notification too
  + Honour the server offline notification setting
  + Keep the server's tracks when the transcode track dialog is disabled
  + Treat 0 days in next episodes as no limit again
  + Remove the enhanced artwork setting
  + Short help text for every visible setting
dependencies:
  py3:
    - addon: 'xbmc.python'
      version: '3.0.0'
    - addon: 'script.module.requests'
      version: '2.22.0+matrix.1'
    - addon: 'script.module.dateutil'
      version: '2.8.1+matrix.1'
    - addon: 'script.module.websocket'
      version: '1.6.4'
    - addon: 'script.module.typing_extensions'
      version: '4.7.1'
